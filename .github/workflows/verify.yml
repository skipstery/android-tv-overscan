name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.13']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python projector_calibrator.py --help
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sdkmanager 'platforms;android-34' 'build-tools;36.0.0'
      - run: python3 scripts/test_geometry.py
      - run: python3 build.py
